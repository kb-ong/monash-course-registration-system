server:
  port: 8080

spring:
  application:
    name: monash-course-registration
  datasource:
    url: jdbc:h2:mem:registration;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-monash-course-registration-secret-key-0123456789}
    expiration-minutes: 120
  registration:
    period-start: ${REGISTRATION_START:2026-10-01T00:00:00}
    period-end: ${REGISTRATION_END:2026-12-20T23:59:59}
    active-semester: ${ACTIVE_SEMESTER:2026-S2}
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    edu.monash.registration: INFO
